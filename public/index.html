<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>🌿 Grow Simulator 2.0</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d1a0d;--text:#e0e0e0;--hint:#8a9a8a;--button:#2e7d32;--button-text:#fff;--secondary:#1a2e1a;--accent:#4caf50;--danger:#e53935;--warning:#ffb300;--purple:#7b1fa2;--blue:#1e88e5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:20px;overflow-x:hidden}
.header{position:sticky;top:0;z-index:100;background:rgba(13,26,13,0.92);backdrop-filter:blur(12px);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(76,175,80,0.2)}
.stats{display:flex;gap:8px;font-size:12px;font-weight:600;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,0.05);padding:3px 10px;border-radius:20px}
.stat span{color:var(--accent)}
.level-badge{background:var(--purple);color:#fff;font-size:11px;padding:3px 10px;border-radius:12px;font-weight:700}
.tabs{display:flex;background:rgba(26,46,26,0.8);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,0.05);overflow-x:auto;padding:4px 0}
.tab{flex:1;min-width:55px;padding:8px 4px;text-align:center;font-size:10px;font-weight:600;cursor:pointer;opacity:0.5;transition:all 0.3s;border-bottom:2px solid transparent}
.tab.active{opacity:1;border-bottom-color:var(--accent);color:var(--accent)}
.content{padding:10px}.section{display:none}.section.active{display:block}
.farm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pot{border-radius:16px;padding:12px 8px 10px;text-align:center;position:relative;overflow:hidden;min-height:220px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,0.4);border:2px solid rgba(255,255,255,0.05);transition:all 0.3s}
.pot-type-1{background:linear-gradient(145deg,#2d1f1a,#1a100d);border-color:#5d4037}
.pot-type-2{background:linear-gradient(145deg,#1a2d1a,#0d1a0d);border-color:#4caf50}
.pot-type-3{background:linear-gradient(145deg,#2d1f0d,#1a1008);border-color:#ff8f00}
.pot-type-4{background:linear-gradient(145deg,#1a1a2d,#0d0d1a);border-color:#7b1fa2}
.pot-type-5{background:linear-gradient(145deg,#0d2d1a,#081a10);border-color:#00e676}
.pot.locked{opacity:0.5;filter:grayscale(0.6)}
.pot.locked::after{content:'🔒';position:absolute;top:8px;right:8px;font-size:16px}
.pot-emoji{font-size:28px;line-height:1;margin-bottom:2px;position:relative;z-index:2}
.pot-name{font-size:11px;font-weight:700;z-index:1;position:relative}
.pot-status{font-size:10px;color:var(--hint);margin:2px 0 4px;z-index:1;position:relative}
.pot.ready{border-color:var(--accent);box-shadow:0 0 30px rgba(76,175,80,0.15)}
.pot.needs-water{border-color:var(--blue)}
.pot.sick{border-color:var(--danger);animation:shake 0.4s ease-in-out infinite alternate}
@keyframes shake{0%{transform:translateX(-1px)}100%{transform:translateX(1px)}}
.plant-container{position:relative;z-index:1;width:100%;height:100px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:2px}
.plant-container svg{width:80px;height:95px;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.3));transition:all 0.5s}
.plant-container svg.ready{animation:sway 2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.bars{width:100%;display:flex;flex-direction:column;gap:2px;margin:3px 0;z-index:1;position:relative}
.bar-row{display:flex;align-items:center;gap:4px;font-size:8px}
.bar-row span{width:12px;font-size:9px}
.bar{flex:1;height:3px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 0.5s}
.bar-fill.water{background:linear-gradient(90deg,#1565c0,#42a5f5)}
.bar-fill.health{background:linear-gradient(90deg,#2e7d32,#66bb6a)}
.bar-fill.light{background:linear-gradient(90deg,#f57f17,#ffb300)}
.pot-actions{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;z-index:1;position:relative;width:100%}
.btn{background:var(--button);color:var(--button-text);border:none;border-radius:10px;padding:5px 10px;font-size:10px;font-weight:600;cursor:pointer;transition:all 0.2s;box-shadow:0 2px 8px rgba(46,125,50,0.3)}
.btn:active{transform:scale(0.95)}
.btn-secondary{background:rgba(255,255,255,0.08);color:var(--text);box-shadow:none}
.btn-blue{background:var(--blue);box-shadow:0 2px 8px rgba(30,136,229,0.3)}
.btn-warning{background:var(--warning);color:#111;box-shadow:0 2px 8px rgba(255,179,0,0.3)}
.btn-purple{background:var(--purple);box-shadow:0 2px 8px rgba(123,31,162,0.3)}
.btn-full{width:100%}
.btn-small{padding:3px 6px;font-size:9px}
.boost-tag{display:inline-block;background:rgba(33,150,243,0.2);color:#64b5f6;font-size:7px;padding:1px 5px;border-radius:6px;margin-left:2px}
.boost-tag.fert{background:rgba(255,179,0,0.2);color:#ffb300}
.boost-tag.sick{background:rgba(229,57,53,0.3);color:#ef5350;animation:blink 0.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
.disease-warning{background:rgba(229,57,53,0.15);border-radius:6px;padding:2px 6px;margin:3px 0;font-size:9px;color:#ef5350;border:1px solid rgba(229,57,53,0.3);z-index:1;position:relative;animation:blink 1s infinite}
.empty{text-align:center;padding:20px 12px;color:var(--hint)}
.empty-emoji{font-size:32px;margin-bottom:6px}
.inv-count{background:var(--accent);color:#fff;font-size:8px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:3px}
.card{background:rgba(26,46,26,0.8);backdrop-filter:blur(4px);border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,0.05)}
.card-emoji{font-size:22px;width:32px;text-align:center}
.card-info{flex:1;min-width:0}
.card-title{font-weight:600;font-size:12px}
.card-desc{font-size:10px;color:var(--hint)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:flex-end;justify-content:center;z-index:200;padding:10px}
.modal-overlay.show{display:flex}
.modal{background:var(--secondary);border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:16px;border-top:1px solid rgba(76,175,80,0.2)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:12px;text-align:center}
.toast{position:fixed;top:65px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--accent);color:#fff;padding:8px 16px;border-radius:30px;font-size:12px;font-weight:600;opacity:0;transition:all 0.3s;z-index:300;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--danger)}
.customer-banner{background:linear-gradient(135deg,#1a237e,#283593);border-radius:14px;padding:12px;margin-bottom:12px;display:none;border:1px solid rgba(255,255,255,0.1)}
.customer-banner.show{display:block}
.customer-header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.customer-avatar{font-size:30px}
.customer-name{font-weight:700;font-size:14px}
.customer-want{font-size:11px;color:rgba(255,255,255,0.75)}
.customer-actions{display:flex;gap:4px;margin-top:6px}
.customer-actions .btn{flex:1}
.room-info{background:rgba(26,46,26,0.8);border-radius:12px;padding:12px;margin-bottom:10px;font-size:12px;border:1px solid rgba(255,255,255,0.05)}
.ref-card{background:linear-gradient(135deg,#1a237e,#283593);border-radius:14px;padding:14px;text-align:center}
.section-title{font-size:10px;font-weight:600;color:var(--hint);margin:10px 0 4px;text-transform:uppercase;letter-spacing:0.5px}
@media (max-width:400px){.farm-grid{grid-template-columns:1fr}.stats{font-size:10px;gap:4px}.stat{padding:2px 6px}.plant-container{height:80px}.plant-container svg{width:65px;height:80px}}
</style>
</head>
<body>
<div class="header">
  <div class="stats">
    <div class="stat">💰 <span id="money">0</span>$</div>
    <div class="stat">⚡ <span id="energy">100</span></div>
    <div class="stat">🏆 <span id="level">1</span></div>
    <div class="stat">⭐ <span id="rep">0</span></div>
  </div>
  <div class="level-badge" id="xp-badge">0 XP</div>
</div>
<div class="tabs">
  <div class="tab active" data-tab="farm">🌱 Ферма</div>
  <div class="tab" data-tab="shop">🛒 Магазин</div>
  <div class="tab" data-tab="inventory">📦 Склад</div>
  <div class="tab" data-tab="room">🏠 Комната</div>
  <div class="tab" data-tab="process">⚗️ Цех</div>
  <div class="tab" data-tab="friends">👥 Друзья</div>
</div>
<div class="content">
  <div class="section active" id="section-farm">
    <div class="customer-banner" id="customer-banner">
      <div class="customer-header"><div class="customer-avatar" id="cust-avatar">🧑</div><div><div class="customer-name" id="cust-name">Клиент</div><div class="customer-want" id="cust-want">Хочет купить...</div></div></div>
      <div class="customer-actions">
        <button class="btn btn-secondary btn-small" onclick="rejectCustomer()">Отказать</button>
        <button class="btn btn-purple btn-small" onclick="smokeWithCustomer()">🚬 Покурить</button>
        <button class="btn btn-small" onclick="dealWithCustomer()">💰 Продать</button>
      </div>
    </div>
    <div class="farm-grid" id="farm-grid"></div>
    <div style="margin-top:10px;text-align:center">
      <button class="btn btn-secondary btn-full" id="btn-buy-pot" onclick="buyPot()">➕ Купить горшок</button>
    </div>
  </div>
  <div class="section" id="section-shop"><div class="card-list" id="shop-list"></div></div>
  <div class="section" id="section-inventory"><div class="card-list" id="inventory-list"></div><div style="margin-top:10px"><button class="btn btn-full" onclick="sellAll()" id="btn-sell-all">💰 Продать всё</button></div></div>
  <div class="section" id="section-room"><div class="room-info" id="room-info"></div><div id="daily-box"></div><div class="card-list" id="room-list"></div></div>
  <div class="section" id="section-process"><div class="section-title">Переработка сырья</div><div class="card-list" id="process-list"></div><div class="section-title" style="margin-top:12px">Готовая продукция</div><div class="card-list" id="products-list"></div></div>
  <div class="section" id="section-friends">
    <div class="ref-card">
      <div style="font-weight:700;margin-bottom:6px">👥 Пригласи друзей</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.75);margin-bottom:8px">За каждого: <b>+150$</b> и <b>+20⚡</b></div>
      <div style="display:flex;justify-content:center;gap:12px;margin-bottom:8px;font-size:12px">
        <div>Приглашено: <b id="ref-count">0</b></div>
        <div>Заработано: <b id="ref-earned">0</b>$</div>
      </div>
      <button class="btn btn-full" onclick="shareReferral()">📤 Поделиться</button>
      <button class="btn btn-secondary btn-full" style="margin-top:4px" onclick="copyReferral()">📋 Скопировать</button>
      <div id="friends-list"></div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modal-seed"><div class="modal"><div class="modal-title">Выбери семя</div><div class="card-list" id="seed-list"></div><button class="btn btn-secondary btn-full" style="margin-top:10px" onclick="closeModal('modal-seed')">Отмена</button></div></div>
<div class="modal-overlay" id="modal-fert"><div class="modal"><div class="modal-title">Удобрения / Лечение</div><div class="card-list" id="fert-list"></div><button class="btn btn-secondary btn-full" style="margin-top:10px" onclick="closeModal('modal-fert')">Отмена</button></div></div>
<div class="toast" id="toast"></div>
<script>
// ============================================================
// ====== НАСТРОЙКИ ======
// ============================================================
const BOT_USERNAME = 'Rastafaray420_bot';

// ============================================================
// ====== ИНИЦИАЛИЗАЦИЯ ======
// ============================================================
const tg = window.Telegram?.WebApp;
let userId = 'guest_' + Math.random().toString(36).slice(2,9);
if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('secondary_bg_color'); } catch(e) {}
    if (tg.initDataUnsafe?.user?.id) {
        userId = String(tg.initDataUnsafe.user.id);
    }
}

const SERVER_URL = window.location.origin;

// ============================================================
// ====== ДАННЫЕ ИГРЫ ======
// ============================================================
const STRAINS = [
    {id:'skunk',name:'Skunk',emoji:'🦨',seedPrice:50,baseTime:120,yield:3,sellPrice:50,energyCost:5,unlock:1},
    {id:'haze',name:'Purple Haze',emoji:'💜',seedPrice:130,baseTime:140,yield:5,sellPrice:85,energyCost:8,unlock:2},
    {id:'widow',name:'White Widow',emoji:'⚪',seedPrice:280,baseTime:160,yield:7,sellPrice:140,energyCost:12,unlock:3},
    {id:'alien',name:'Alien Kush',emoji:'👽',seedPrice:550,baseTime:180,yield:12,sellPrice:220,energyCost:18,unlock:4},
    {id:'og',name:'OG Kush',emoji:'🔥',seedPrice:950,baseTime:200,yield:18,sellPrice:340,energyCost:25,unlock:5},
    {id:'cheese',name:'UK Cheese',emoji:'🧀',seedPrice:400,baseTime:150,yield:10,sellPrice:180,energyCost:15,unlock:3},
    {id:'lemon',name:'Lemon Haze',emoji:'🍋',seedPrice:350,baseTime:145,yield:8,sellPrice:160,energyCost:14,unlock:3},
    {id:'blue',name:'Blue Dream',emoji:'💎',seedPrice:600,baseTime:170,yield:14,sellPrice:250,energyCost:20,unlock:4},
    {id:'cookies',name:'Girl Scout Cookies',emoji:'🍪',seedPrice:750,baseTime:190,yield:16,sellPrice:290,energyCost:22,unlock:5},
    {id:'gelato',name:'Gelato',emoji:'🍦',seedPrice:900,baseTime:210,yield:20,sellPrice:380,energyCost:28,unlock:6},
    {id:'wedding',name:'Wedding Cake',emoji:'🎂',seedPrice:1100,baseTime:220,yield:22,sellPrice:420,energyCost:30,unlock:7},
    {id:'runtz',name:'Runtz',emoji:'🍬',seedPrice:1300,baseTime:230,yield:25,sellPrice:480,energyCost:32,unlock:8},
    {id:'zkittlez',name:'Zkittlez',emoji:'🌈',seedPrice:1500,baseTime:240,yield:28,sellPrice:520,energyCost:35,unlock:9},
    {id:'kush',name:'Master Kush',emoji:'👑',seedPrice:1800,baseTime:260,yield:32,sellPrice:580,energyCost:38,unlock:10},
    {id:'glue',name:'Gorilla Glue',emoji:'🦍',seedPrice:2200,baseTime:280,yield:35,sellPrice:650,energyCost:40,unlock:11}
];

const POT_TYPES = [
    {id:1,name:'Дырявый ботинок',emoji:'👢',price:0,desc:'Старый ботинок вместо горшка',unlockLevel:1,class:'pot-type-1'},
    {id:2,name:'Пластиковый горшок',emoji:'🪴',price:500,desc:'Обычный пластиковый',unlockLevel:2,class:'pot-type-2'},
    {id:3,name:'Глиняный горшок',emoji:'🏺',price:1200,desc:'Дышит, корням комфортно',unlockLevel:4,class:'pot-type-3'},
    {id:4,name:'Мешок-горшок',emoji:'🎒',price:2500,desc:'Специальный тканевый мешок',unlockLevel:6,class:'pot-type-4'},
    {id:5,name:'Гидропоника',emoji:'💧',price:5000,desc:'Профессиональная система',unlockLevel:8,class:'pot-type-5'}
];

const LAMPS = [
    {id:'lamp1',name:'CFL',emoji:'💡',price:150,power:1.15,desc:'+15%'},
    {id:'lamp2',name:'LED',emoji:'✨',price:400,power:1.35,desc:'+35%'},
    {id:'lamp3',name:'HPS',emoji:'🔆',price:900,power:1.6,desc:'+60%'},
    {id:'lamp4',name:'Квантовая',emoji:'💎',price:2000,power:2.0,desc:'+100%'}
];
const LAMP_ENERGY_COST = {lamp1:0.3,lamp2:0.6,lamp3:1.2,lamp4:1.8};

const FERTS = [
    {id:'water_boost',name:'Супер-вода',emoji:'💧',price:40,effect:'speed',value:0.2,desc:'+20% скорость'},
    {id:'yield_boost',name:'Удобрение+',emoji:'🧪',price:90,effect:'yield',value:0.4,desc:'+40% урожай'},
    {id:'heal',name:'Лекарство',emoji:'💊',price:60,effect:'heal',value:1,desc:'Лечит болезнь'},
    {id:'mega',name:'Мега-буст',emoji:'🚀',price:350,effect:'both',value:0.35,desc:'+35% всё'}
];

const ROOM_UPGRADES = [
    {id:'vent',name:'Вентиляция',emoji:'🌀',price:500,type:'vent',desc:'Болезни реже на 60%'},
    {id:'auto',name:'Автополив',emoji:'💦',price:1200,type:'auto',desc:'Вода убывает на 55% медленнее'}
];

const CUSTOMERS = [
    {name:'Вася',emoji:'🧑🦰',prefer:null,mult:1.1,smoke:15,rep:1},
    {name:'Марина',emoji:'👩',prefer:'haze',mult:1.35,smoke:20,rep:2},
    {name:'Колян',emoji:'🧔',prefer:'skunk',mult:1.2,smoke:12,rep:1},
    {name:'DJ Max',emoji:'🎧',prefer:'og',mult:1.55,smoke:25,rep:3},
    {name:'Аня',emoji:'👱♀️',prefer:'widow',mult:1.3,smoke:18,rep:2},
    {name:'Инопланетянин',emoji:'👽',prefer:'alien',mult:1.9,smoke:30,rep:4},
    {name:'Боб',emoji:'🧔♂️',prefer:null,mult:1.25,smoke:22,rep:2},
    {name:'Студент',emoji:'🎓',prefer:'skunk',mult:1.08,smoke:10,rep:1}
];

const STAGE_NAMES = ['','Семя','Росток','Вегетация','Цветение','Готово'];
const PRODUCTS = {
    dried:{name:'Сушка',emoji:'🍂',mult:1.4,energy:3,from:'raw'},
    joint:{name:'Косяк',emoji:'🚬',mult:1.9,energy:5,from:'dried',need:1},
    oil:{name:'Масло',emoji:'🧴',mult:2.4,energy:8,from:'dried',need:2},
    edible:{name:'Еда',emoji:'🍪',mult:2.8,energy:10,from:'dried',need:2}
};

// ============================================================
// ====== СОСТОЯНИЕ ИГРЫ ======
// ============================================================
let state = {
    money: 250,
    energy: 100,
    maxEnergy: 100,
    level: 1,
    xp: 0,
    rep: 0,
    pots: [],
    inventory: {},
    lamps: {},
    ferts: {},
    room: { vent: false, auto: false },
    referrals: 0,
    referralEarned: 0,
    referralsList: [],
    referredBy: null,
    lastCustomerAt: 0,
    currentCustomer: null,
    lastUpdate: Date.now(),
    daily: null,
    nextPotId: 1,
    potTypeUnlocked: 1
};
let selectedPotId = null;

// ============================================================
// ====== БАЗОВЫЕ ФУНКЦИИ ======
// ============================================================
function haptic(t='light') {
    try {
        if (tg?.HapticFeedback) {
            if (t === 'success') tg.HapticFeedback.notificationOccurred('success');
            else if (t === 'error') tg.HapticFeedback.notificationOccurred('error');
            else tg.HapticFeedback.impactOccurred(t);
        }
    } catch(e) {}
}

function save() {
    state.lastUpdate = Date.now();
    try {
        localStorage.setItem('grow_sim_v2_' + userId, JSON.stringify(state));
    } catch(e) {}
}

function load() {
    try {
        const raw = localStorage.getItem('grow_sim_v2_' + userId);
        if (raw) {
            const l = JSON.parse(raw);
            state = { ...state, ...l };
        }
    } catch(e) {}
    if (state.pots.length === 0) {
        state.pots.push({
            id: state.nextPotId++,
            strain: null,
            plantedAt: null,
            water: 100,
            health: 100,
            stage: 0,
            disease: false,
            lamp: null,
            fert: null,
            speedMult: 1,
            yieldMult: 1,
            lastTick: Date.now(),
            _lastWarning: null,
            potType: 1
        });
    }
}

function showToast(m, err=false) {
    const t = document.getElementById('toast');
    t.textContent = m;
    t.className = 'toast show' + (err ? ' error' : '');
    setTimeout(() => t.classList.remove('show'), 2200);
}

function formatTime(s) {
    if (s <= 0) return 'Готово!';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m > 0 ? `${m}м ${sec}с` : `${sec}с`;
}

function getStrain(id) { return STRAINS.find(s => s.id === id); }
function getLamp(id) { return LAMPS.find(l => l.id === id); }
function getFert(id) { return FERTS.find(f => f.id === id); }
function getPotType(id) { return POT_TYPES.find(p => p.id === id); }
function xpFor(l) { return l * 100; }

function addXp(a) {
    state.xp += a;
    let up = false;
    while (state.xp >= xpFor(state.level)) {
        state.xp -= xpFor(state.level);
        state.level++;
        state.maxEnergy = 100 + (state.level - 1) * 10;
        state.energy = state.maxEnergy;
        up = true;
        if (state.level % 2 === 0 && state.potTypeUnlocked < POT_TYPES.length) {
            state.potTypeUnlocked++;
            showToast('🔓 Новый горшок: ' + POT_TYPES[state.potTypeUnlocked - 1].name);
        }
    }
    if (up) {
        showToast('🎉 Уровень ' + state.level + '!');
        haptic('success');
    }
    save();
    render();
}

async function registerUser(referredBy) {
    try {
        console.log('📤 Отправка запроса на регистрацию...');
        const response = await fetch(SERVER_URL + '/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId: userId,
                userName: tg?.initDataUnsafe?.user?.first_name || 'Игрок',
                referredBy: referredBy
            })
        });
        const data = await response.json();
        console.log('✅ Ответ сервера:', data);
        return data;
    } catch (e) {
        console.error('❌ Ошибка:', e);
        return null;
    }
}

async function fetchStats() {
    try {
        const response = await fetch(SERVER_URL + '/api/stats/' + userId);
        const data = await response.json();
        console.log('📊 Статистика:', data);
        return data;
    } catch (e) {
        console.error('❌ Ошибка получения статистики:', e);
        return null;
    }
}

async function handleReferral() {

    console.log('📌 userId:', userId);
    console.log('📌 tg:', tg);
    console.log('📌 start_param:', tg?.initDataUnsafe?.start_param);
    
    // Проверяем параметр startapp

        console.log('📥 Параметр start_param:', param);
        
        if (param.startsWith('ref_')) {
            const refId = param.replace('ref_', '');
            console.log('👤 Реферальный ID:', refId);
            console.log('👤 Мой ID:', userId);
            
            if (refId !== userId && !state.referredBy) {
                console.log('✅ Новый реферал! Начисляем бонус...');
                state.referredBy = refId;
                
                const result = await registerUser(refId);
                if (result?.success) {

function plantSeed(sid) {
    const s = getStrain(sid);
    if (!s) return;
    if (state.money < s.seedPrice || state.energy < s.energyCost) {
        showToast('Не хватает', true);
        return;
    }
    const pot = state.pots.find(p => p.id === selectedPotId);
    if (!pot || pot.strain) return;
    state.money -= s.seedPrice;
    state.energy -= s.energyCost;
    pot.strain = sid;
    pot.plantedAt = Date.now();
    pot.water = 80;
    pot.health = 100;
    pot.stage = 1;
    pot.disease = false;
    pot.speedMult = 1;
    pot.yieldMult = 1;
    pot.lastTick = Date.now();
    closeModal('modal-seed');
    showToast('Посажено: ' + s.name);
    haptic('medium');
    addXp(5);
    save();
    render();
}

function harvest(id) {
    const pot = state.pots.find(p => p.id === id);
    if (!pot || !pot.strain || getProgress(pot) < 1) return;
    if (pot.health < 25) { showToast('Растение слабое', true); return; }
    const s = getStrain(pot.strain);
    const q = getQuality(pot);
    let amount = Math.floor(s.yield * (pot.yieldMult || 1) * (pot.health / 100) * (q >= 1.25 ? 1.1 : 1));
    if (amount < 1) amount = 1;
    state.inventory[pot.strain] = (state.inventory[pot.strain] || 0) + amount;
    showToast(`🌿 +${amount} ${s.name}`);
    haptic('success');
    addXp(amount * 3 + Math.floor(q * 4));
    pot.strain = null;
    pot.plantedAt = null;
    pot.stage = 0;
    pot.disease = false;
    pot.water = 100;
    pot.health = 100;
    pot.fert = null;
    pot.lamp = null;
    pot.speedMult = 1;
    pot.yieldMult = 1;
    save();
    render();
}

function getEffectiveTime(pot) {
    const s = getStrain(pot.strain);
    if (!s) return 9999;
    let mult = (pot.speedMult || 1);
    if (pot.lamp && state.energy > 2) {
        const l = getLamp(pot.lamp);
        if (l) {
            const ef = Math.min(1, state.energy / 20);
            mult *= (1 + (l.power - 1) * ef);
        }
    }
    if (state.room.vent) mult *= 1.05;
    return s.baseTime / mult;
}

function getProgress(pot) {
    if (!pot.strain || !pot.plantedAt) return 0;
    const t = getEffectiveTime(pot);
    return Math.min(1, (Date.now() - pot.plantedAt) / 1000 / t);
}

function updatePotStage(pot) {
    const p = getProgress(pot);
    if (p >= 1) pot.stage = 5;
    else if (p >= 0.75) pot.stage = 4;
    else if (p >= 0.45) pot.stage = 3;
    else if (p >= 0.2) pot.stage = 2;
    else pot.stage = 1;
}

function getQuality(pot) {
    let q = 1.0;
    if (pot.health >= 90) q += 0.25;
    else if (pot.health >= 70) q += 0.1;
    else if (pot.health < 40) q -= 0.3;
    if (pot.lamp && state.energy > 5) {
        const l = getLamp(pot.lamp);
        if (l) {
            const ef = Math.min(1, state.energy / 30);
            q += (l.power - 1) * 0.4 * ef;
        }
    }
    if (pot.fert) q += 0.15;
    if (pot.disease) q -= 0.4;
    if (q < 0.5) q = 0.5;
    if (q > 2.0) q = 2.0;
    return q;
}

function buyPot() {
    let maxType = 1;
    for (let i = 0; i < POT_TYPES.length; i++) {
        if (state.level >= POT_TYPES[i].unlockLevel) maxType = POT_TYPES[i].id;
    }
    const pt = getPotType(maxType);
    if (!pt) { showToast('Ошибка', true); return; }
    const price = pt.price + state.pots.length * 100;
    if (state.money < price) { showToast('Мало денег', true); return; }
    state.money -= price;
    state.pots.push({
        id: state.nextPotId++,
        strain: null,
        plantedAt: null,
        water: 100,
        health: 100,
        stage: 0,
        disease: false,
        lamp: null,
        fert: null,
        speedMult: 1,
        yieldMult: 1,
        lastTick: Date.now(),
        _lastWarning: null,
        potType: pt.id
    });
    showToast('🪴 Новый ' + pt.name);
    haptic('success');
    addXp(8);
    save();
    render();
}

}

function buyRoomUpgrade(uid) {
    const u = ROOM_UPGRADES.find(x => x.id === uid);
    if (!u || state.money < u.price) { showToast('Мало денег', true); return; }
    if ((u.type === 'vent' && state.room.vent) || (u.type === 'auto' && state.room.auto)) {
        showToast('Уже куплено');
        return;
    }
    state.money -= u.price;
    if (u.type === 'vent') state.room.vent = true;
    if (u.type === 'auto') state.room.auto = true;
    showToast('Куплено: ' + u.name);
    haptic('success');
    addXp(15);
    save();
    render();
}

function sellAll() {
    let total = 0, items = 0;
    for (const [id, amt] of Object.entries(state.inventory)) {
        if (amt <= 0) continue;
        const info = getProductInfo(id);
        if (info) {
            total += amt * info.sellPrice;
            items += amt;
        }
    }
    if (!items) { showToast('Склад пуст', true); return; }
    state.money += total;
    state.inventory = {};
    showToast('Продано за ' + total + '$');
    haptic('success');
    addXp(Math.floor(total / 12));
    save();
    render();
}

function getProductInfo(key) {
    const s = getStrain(key);
    if (s) return { name: s.name + ' (сырец)', emoji: s.emoji, sellPrice: s.sellPrice, strain: key, type: 'raw' };
    if (key.endsWith('_dried')) {
        const sid = key.replace('_dried', '');
        const s2 = getStrain(sid);
        if (s2) return { name: s2.name + ' (сушка)', emoji: '🍂', sellPrice: Math.floor(s2.sellPrice * 1.4), strain: sid, type: 'dried' };
    }
    if (key.endsWith('_joint')) {
        const sid = key.replace('_joint', '');
        const s2 = getStrain(sid);
        if (s2) return { name: s2.name + ' косяк', emoji: '🚬', sellPrice: Math.floor(s2.sellPrice * 1.9), strain: sid, type: 'joint' };
    }
    if (key.endsWith('_oil')) {
        const sid = key.replace('_oil', '');
        const s2 = getStrain(sid);
        if (s2) return { name: s2.name + ' масло', emoji: '🧴', sellPrice: Math.floor(s2.sellPrice * 2.4), strain: sid, type: 'oil' };
    }
    if (key.endsWith('_edible')) {
        const sid = key.replace('_edible', '');
        const s2 = getStrain(sid);
        if (s2) return { name: s2.name + ' еда', emoji: '🍪', sellPrice: Math.floor(s2.sellPrice * 2.8), strain: sid, type: 'edible' };
    }
    return null;
}

function processItem(strainId, productType) {
    const p = PRODUCTS[productType];
    if (!p) return;
    const rawKey = strainId;
    const driedKey = strainId + '_dried';
    const outKey = strainId + '_' + productType;
    if (productType === 'dried') {
        if ((state.inventory[rawKey] || 0) < 1) { showToast('Нет сырья', true); return; }
        if (state.energy < p.energy) { showToast('Мало энергии', true); return; }
        state.inventory[rawKey]--;
        if (state.inventory[rawKey] <= 0) delete state.inventory[rawKey];
        state.energy -= p.energy;
        state.inventory[driedKey] = (state.inventory[driedKey] || 0) + 1;
        showToast('🍂 Высушено!');
    } else {
        const need = p.need || 1;
        if ((state.inventory[driedKey] || 0) < need) { showToast('Нужна сушка ×' + need, true); return; }
        if (state.energy < p.energy) { showToast('Мало энергии', true); return; }
        state.inventory[driedKey] -= need;
        if (state.inventory[driedKey] <= 0) delete state.inventory[driedKey];
        state.energy -= p.energy;
        state.inventory[outKey] = (state.inventory[outKey] || 0) + 1;
        showToast(p.emoji + ' ' + p.name);
    }
    haptic('success');
    addXp(4);
    save();
    render();
}

function sellProduct(key) {
    const amt = state.inventory[key] || 0;
    if (amt <= 0) return;
    const info = getProductInfo(key);
    if (!info) return;
    const total = amt * info.sellPrice;
    state.money += total;
    delete state.inventory[key];
    showToast('Продано за ' + total + '$');
    haptic('success');
    addXp(Math.floor(total / 10));
    save();
    render();
}

function applyFert(fid) {
    const pot = state.pots.find(p => p.id === selectedPotId);
    if (!pot || !pot.strain) return;
    if ((state.ferts[fid] || 0) <= 0) return;
    const f = getFert(fid);
    state.ferts[fid]--;
    if (f.effect === 'heal') {
        pot.disease = false;
        pot.health = Math.min(100, pot.health + 40);
        showToast('💊 Вылечено!');
        pot._lastWarning = null;
    } else {
        if (f.effect === 'speed' || f.effect === 'both') pot.speedMult = (pot.speedMult || 1) * (1 + f.value);
        if (f.effect === 'yield' || f.effect === 'both') pot.yieldMult = (pot.yieldMult || 1) * (1 + f.value);
        pot.fert = fid;
        showToast(f.emoji + ' ' + f.name);
    }
    closeModal('modal-fert');
    haptic('success');
    addXp(3);
    save();
    render();
}

function applyLampToPot(potId, lampId) {
    const pot = state.pots.find(p => p.id === potId);
    if (!pot || !pot.strain) { showToast('Сначала посади', true); return; }
    const lamp = getLamp(lampId);
    if (!lamp) return;
    if ((state.lamps[lampId] || 0) <= 0) { showToast('Нет лампы', true); return; }
    if (pot.lamp) { state.lamps[pot.lamp] = (state.lamps[pot.lamp] || 0) + 1; }
    state.lamps[lampId]--;
    pot.lamp = lampId;
    pot.speedMult = 1;
    showToast('💡 ' + lamp.name);
    haptic('success');
    save();
    render();
}

        document.querySelector('#modal-seed .modal-title').textContent = 'Выбери семя';
    }
}

function spawnCustomer() {
    if (state.currentCustomer || Date.now() - state.lastCustomerAt < 50000) return;
    const has = Object.values(state.inventory).some(v => v > 0);
    if (!has) return;
    const cust = CUSTOMERS[Math.floor(Math.random() * CUSTOMERS.length)];
    let want = cust.prefer;
    if (!want || !(state.inventory[want] > 0)) {
        const av = Object.keys(state.inventory).filter(k => state.inventory[k] > 0);
        if (!av.length) return;
        want = av[Math.floor(Math.random() * av.length)];
    }
    const amount = Math.min(state.inventory[want], 1 + Math.floor(Math.random() * 3));
    const s = getStrain(want);
    const price = Math.floor(s.sellPrice * amount * cust.mult * (1 + state.rep * 0.01));
    state.currentCustomer = { ...cust, wantId: want, amount, price, smoked: false, expiresAt: Date.now() + 40000 };
    state.lastCustomerAt = Date.now();
    const c = state.currentCustomer;
    const s2 = getStrain(c.wantId);
    document.getElementById('cust-avatar').textContent = c.emoji;
    document.getElementById('cust-name').textContent = c.name;
    document.getElementById('cust-want').textContent = `Хочет ${c.amount}× ${s2.name} за ${c.price}$`;
    document.getElementById('customer-banner').classList.add('show');
}

function dealWithCustomer() {
    const c = state.currentCustomer;
    if (!c) return;
    if ((state.inventory[c.wantId] || 0) < c.amount) { showToast('Мало товара', true); return; }
    state.inventory[c.wantId] -= c.amount;
    if (state.inventory[c.wantId] <= 0) delete state.inventory[c.wantId];
    state.money += c.price;
    state.rep += c.rep || 1;
    showToast(`Сделка! +${c.price}$`);
    haptic('success');
    addXp(Math.floor(c.price / 8));
    state.currentCustomer = null;
    document.getElementById('customer-banner').classList.remove('show');
    save();
    render();
}

function smokeWithCustomer() {
    const c = state.currentCustomer;
    if (!c || c.smoked) return;
    let consumed = false;
    for (const [key, amt] of Object.entries(state.inventory)) {
        if (amt > 0) {
            state.inventory[key]--;
            if (state.inventory[key] <= 0) delete state.inventory[key];
            consumed = true;
            break;
        }
    }
    if (!consumed) { showToast('Нечего курить', true); return; }
    c.smoked = true;
    state.energy = Math.min(state.maxEnergy, state.energy + c.smoke);
    c.mult += 0.15;
    const base = getStrain(c.wantId) ? getStrain(c.wantId).sellPrice : 50;
    c.price = Math.floor(base * c.amount * c.mult * (1 + state.rep * 0.01));
    document.getElementById('cust-want').textContent = `Хочет ${c.amount}× за ${c.price}$ (после покура)`;
    showToast(`🚬 +${c.smoke}⚡`);
    haptic('medium');
    save();
    render();
}

function rejectCustomer() {
    showToast((state.currentCustomer?.name || 'Клиент') + ' ушёл');

}

        cheese: { leaf: '#fdd835', dark: '#f9a825', flower: '#ffee58' },
        lemon: { leaf: '#c0ca33', dark: '#827717', flower: '#fff176' },

    } else if (s === 4) {
        svg = `<svg viewBox="0 0 100 120"><ellipse cx="50" cy="108" rx="36" ry="10" fill="#3e2723" opacity="0.2"/><line x1="50" y1="103" x2="50" y2="40" stroke="${c.dark}" stroke-width="5" opacity="${hf}"/><path d="M50 55 Q28 40 15 60 Q30 50 50 55" fill="${c.leaf}" opacity="${hf*0.6}"/><path d="M50 55 Q72 40 85 60 Q70 50 50 55" fill="${c.leaf}" opacity="${hf*0.6}"/><path d="M50 70 Q35 58 22 75 Q38 68 50 70" fill="${c.leaf}" opacity="${hf*0.5}"/><path d="M50 70 Q65 58 78 75 Q62 68 50 70" fill="${c.leaf}" opacity="${hf*0.5}"/><circle cx="50" cy="45" r="12" fill="${c.flower}" opacity="${hf*0.5}"/><circle cx="35" cy="55" r="8" fill="${c.flower}" opacity="${hf*0.4}"/><circle cx="65" cy="55" r="8" fill="${c.flower}" opacity="${hf*0.4}"/>${isSick?`<circle cx="50" cy="65" r="18" fill="none" stroke="#e53935" stroke-width="2" opacity="0.5"><animate attributeName="r" from="15" to="20" dur="0.8s" repeatCount="indefinite"/></circle>`:''}</svg>`;

}

function renderFarm() {
    const grid = document.getElementById('farm-grid');
    grid.innerHTML = '';
    if (state.pots.length === 0) {
        grid.innerHTML = '<div class="empty"><div class="empty-emoji">🪴</div>Нет горшков!<br><small>Нажми "Купить горшок" ниже</small></div>';
        document.getElementById('btn-buy-pot').textContent = '➕ Купить горшок (350$)';
        return;
    }
    state.pots.forEach(pot => {
        const div = document.createElement('div');
        const pt = getPotType(pot.potType) || POT_TYPES[0];
        div.className = 'pot ' + pt.class;
        if (state.level < pt.unlockLevel) div.classList.add('locked');
        let roomIndicators = '';
        if (state.room.auto && pot.strain) roomIndicators += '<span class="boost-tag" style="background:rgba(33,150,243,0.3);color:#42a5f5;">💧Авто</span>';
        if (state.room.vent && pot.strain) roomIndicators += '<span class="boost-tag" style="background:rgba(76,175,80,0.3);color:#66bb6a;">🌀Вент</span>';
        if (!pot.strain) {
            div.innerHTML += `<div class="pot-emoji">${pt.emoji}</div><div class="pot-name">${pt.name} ${roomIndicators}</div><div class="pot-status">${state.level >= pt.unlockLevel ? 'Готов к посадке' : '🔒 Уровень ' + pt.unlockLevel}</div>`;
            if (state.level >= pt.unlockLevel) div.innerHTML += `<button class="btn btn-full" onclick="openSeedModal(${pot.id})">Посадить</button>`;
        } else {
            const s = getStrain(pot.strain);
            const prog = getProgress(pot);
            const left = Math.max(0, Math.ceil(getEffectiveTime(pot) - (Date.now() - pot.plantedAt) / 1000));
            updatePotStage(pot);
            const ready = prog >= 1;
            if (ready) div.classList.add('ready');
            else if (pot.water < 25) div.classList.add('needs-water');
            if (pot.disease) div.classList.add('sick');
            let tags = '';
            if (pot.disease) tags += '<span class="boost-tag sick" style="animation:blink 0.8s infinite;">🦠ВРЕДИТЕЛИ!</span>';
            if (pot.lamp) {
                const l = getLamp(pot.lamp);
                if (l) {
                    const cost = LAMP_ENERGY_COST[pot.lamp] || 0;
                    const isActive = state.energy > 2;
                    tags += `<span class="boost-tag" style="${isActive ? 'background:rgba(76,175,80,0.3);color:#4caf50' : 'background:rgba(255,0,0,0.3);color:#ef5350'}">💡${l.emoji} ${isActive ? '✅' : '⛔'} ⚡${cost.toFixed(1)}</span>`;
                }
            }
            if (pot.fert) tags += '<span class="boost-tag fert">🧪</span>';
            tags += roomIndicators;
            let diseaseWarning = '';
            if (pot.disease) diseaseWarning = '<div class="disease-warning">🚨 Вредители! Используй 💊 Лекарство!</div>';
            let actions = '';
            if (ready) {
                actions = `<button class="btn btn-full" onclick="harvest(${pot.id})">🌿 Собрать</button>`;
            } else {
                actions = `<div class="pot-actions"><button class="btn btn-blue btn-small" onclick="waterPot(${pot.id})">💧</button><button class="btn btn-warning btn-small" onclick="openFertModal(${pot.id})">🧪</button><button class="btn btn-purple btn-small" onclick="openLampModal(${pot.id})">💡</button></div>`;
            }
            div.innerHTML += `
                <div class="pot-emoji">${pt.emoji}</div>
                <div class="pot-name">${s.name} ${tags}</div>
                <div class="pot-status">${ready ? '✅ Готово!' : STAGE_NAMES[pot.stage] + ' · ' + formatTime(left)}</div>
                ${diseaseWarning}
                <div class="plant-container">${getPlantSVG(pot.strain, pot.stage, pot.health, pot.disease, ready)}</div>
                <div class="bars">
                    <div class="bar-row"><span>💧</span><div class="bar"><div class="bar-fill water" style="width:${pot.water}%"></div></div></div>
                    <div class="bar-row"><span>❤️</span><div class="bar"><div class="bar-fill health" style="width:${pot.health}%"></div></div></div>
                    <div class="bar-row"><span>⏱</span><div class="bar"><div class="bar-fill light" style="width:${prog * 100}%"></div></div></div>
                </div>
                ${actions}
            `;
        }
        grid.appendChild(div);
    });
    const maxType = state.level >= 8 ? 5 : state.level >= 6 ? 4 : state.level >= 4 ? 3 : state.level >= 2 ? 2 : 1;
    const pt2 = getPotType(maxType);
    const price = (pt2?.price || 0) + state.pots.length * 100;
    document.getElementById('btn-buy-pot').textContent = '➕ Купить горшок (' + price + '$)';
}
