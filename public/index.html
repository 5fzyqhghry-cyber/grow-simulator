<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>🌿 Grow Simulator 2.0</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d1a0d;--text:#e0e0e0;--hint:#8a9a8a;--button:#2e7d32;--button-text:#fff;--secondary:#1a2e1a;--accent:#4caf50;--danger:#e53935;--warning:#ffb300;--purple:#7b1fa2;--blue:#1e88e5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:20px;overflow-x:hidden}
.header{position:sticky;top:0;z-index:100;background:rgba(13,26,13,0.92);backdrop-filter:blur(12px);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(76,175,80,0.2)}
.stats{display:flex;gap:8px;font-size:12px;font-weight:600;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,0.05);padding:3px 10px;border-radius:20px}
.stat span{color:var(--accent)}
.level-badge{background:var(--purple);color:#fff;font-size:11px;padding:3px 10px;border-radius:12px;font-weight:700}
.tabs{display:flex;background:rgba(26,46,26,0.8);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,0.05);overflow-x:auto;padding:4px 0}
.tab{flex:1;min-width:55px;padding:8px 4px;text-align:center;font-size:10px;font-weight:600;cursor:pointer;opacity:0.5;transition:all 0.3s;border-bottom:2px solid transparent}
.tab.active{opacity:1;border-bottom-color:var(--accent);color:var(--accent)}
.content{padding:10px}.section{display:none}.section.active{display:block}
.farm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pot{border-radius:16px;padding:12px 8px 10px;text-align:center;position:relative;overflow:hidden;min-height:220px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,0.4);border:2px solid rgba(255,255,255,0.05);transition:all 0.3s}
.pot-type-1{background:linear-gradient(145deg,#2d1f1a,#1a100d);border-color:#5d4037}
.pot-type-2{background:linear-gradient(145deg,#1a2d1a,#0d1a0d);border-color:#4caf50}
.pot-type-3{background:linear-gradient(145deg,#2d1f0d,#1a1008);border-color:#ff8f00}
.pot-type-4{background:linear-gradient(145deg,#1a1a2d,#0d0d1a);border-color:#7b1fa2}
.pot-type-5{background:linear-gradient(145deg,#0d2d1a,#081a10);border-color:#00e676}
.pot.locked{opacity:0.5;filter:grayscale(0.6)}
.pot.locked::after{content:'🔒';position:absolute;top:8px;right:8px;font-size:16px}
.pot-emoji{font-size:28px;line-height:1;margin-bottom:2px;position:relative;z-index:2}
.pot-name{font-size:11px;font-weight:700;z-index:1;position:relative}
.pot-status{font-size:10px;color:var(--hint);margin:2px 0 4px;z-index:1;position:relative}
.pot.ready{border-color:var(--accent);box-shadow:0 0 30px rgba(76,175,80,0.15)}
.pot.needs-water{border-color:var(--blue)}
.pot.sick{border-color:var(--danger);animation:shake 0.4s ease-in-out infinite alternate}
@keyframes shake{0%{transform:translateX(-1px)}100%{transform:translateX(1px)}}
.plant-container{position:relative;z-index:1;width:100%;height:100px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:2px}
.plant-container svg{width:80px;height:95px;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.3));transition:all 0.5s}
.plant-container svg.ready{animation:sway 2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.bars{width:100%;display:flex;flex-direction:column;gap:2px;margin:3px 0;z-index:1;position:relative}
.bar-row{display:flex;align-items:center;gap:4px;font-size:8px}
.bar-row span{width:12px;font-size:9px}
.bar{flex:1;height:3px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 0.5s}
.bar-fill.water{background:linear-gradient(90deg,#1565c0,#42a5f5)}
.bar-fill.health{background:linear-gradient(90deg,#2e7d32,#66bb6a)}
.bar-fill.light{background:linear-gradient(90deg,#f57f17,#ffb300)}
.pot-actions{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;z-index:1;position:relative;width:100%}
.btn{background:var(--button);color:var(--button-text);border:none;border-radius:10px;padding:5px 10px;font-size:10px;font-weight:600;cursor:pointer;transition:all 0.2s;box-shadow:0 2px 8px rgba(46,125,50,0.3)}
.btn:active{transform:scale(0.95)}
.btn-secondary{background:rgba(255,255,255,0.08);color:var(--text);box-shadow:none}
.btn-blue{background:var(--blue);box-shadow:0 2px 8px rgba(30,136,229,0.3)}
.btn-warning{background:var(--warning);color:#111;box-shadow:0 2px 8px rgba(255,179,0,0.3)}
.btn-purple{background:var(--purple);box-shadow:0 2px 8px rgba(123,31,162,0.3)}
.btn-full{width:100%}
.btn-small{padding:3px 6px;font-size:9px}
.boost-tag{display:inline-block;background:rgba(33,150,243,0.2);color:#64b5f6;font-size:7px;padding:1px 5px;border-radius:6px;margin-left:2px}
.boost-tag.fert{background:rgba(255,179,0,0.2);color:#ffb300}
.boost-tag.sick{background:rgba(229,57,53,0.3);color:#ef5350;animation:blink 0.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
.disease-warning{background:rgba(229,57,53,0.15);border-radius:6px;padding:2px 6px;margin:3px 0;font-size:9px;color:#ef5350;border:1px solid rgba(229,57,53,0.3);z-index:1;position:relative;animation:blink 1s infinite}
.empty{text-align:center;padding:20px 12px;color:var(--hint)}
.empty-emoji{font-size:32px;margin-bottom:6px}
.inv-count{background:var(--accent);color:#fff;font-size:8px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:3px}
.card{background:rgba(26,46,26,0.8);backdrop-filter:blur(4px);border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,0.05)}
.card-emoji{font-size:22px;width:32px;text-align:center}
.card-info{flex:1;min-width:0}
.card-title{font-weight:600;font-size:12px}
.card-desc{font-size:10px;color:var(--hint)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:flex-end;justify-content:center;z-index:200;padding:10px}
.modal-overlay.show{display:flex}
.modal{background:var(--secondary);border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:16px;border-top:1px solid rgba(76,175,80,0.2)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:12px;text-align:center}
.toast{position:fixed;top:65px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--accent);color:#fff;padding:8px 16px;border-radius:30px;font-size:12px;font-weight:600;opacity:0;transition:all 0.3s;z-index:300;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--danger)}
.customer-banner{background:linear-gradient(135deg,#1a237e,#283593);border-radius:14px;padding:12px;margin-bottom:12px;display:none;border:1px solid rgba(255,255,255,0.1)}
.customer-banner.show{display:block}
.customer-header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.customer-avatar{font-size:30px}
.customer-name{font-weight:700;font-size:14px}
.customer-want{font-size:11px;color:rgba(255,255,255,0.75)}
.customer-actions{display:flex;gap:4px;margin-top:6px}
.customer-actions .btn{flex:1}
.room-info{background:rgba(26,46,26,0.8);border-radius:12px;padding:12px;margin-bottom:10px;font-size:12px;border:1px solid rgba(255,255,255,0.05)}
.ref-card{background:linear-gradient(135deg,#1a237e,#283593);border-radius:14px;padding:14px;text-align:center}
.section-title{font-size:10px;font-weight:600;color:var(--hint);margin:10px 0 4px;text-transform:uppercase;letter-spacing:0.5px}
@media (max-width:400px){.farm-grid{grid-template-columns:1fr}.stats{font-size:10px;gap:4px}.stat{padding:2px 6px}.plant-container{height:80px}.plant-container svg{width:65px;height:80px}}
</style>
</head>
<body>
<div class="header">
  <div class="stats">
    <div class="stat">💰 <span id="money">0</span>$</div>
    <div class="stat">⚡ <span id="energy">100</span></div>
    <div class="stat">🏆 <span id="level">1</span></div>
    <div class="stat">⭐ <span id="rep">0</span></div>
  </div>
  <div class="level-badge" id="xp-badge">0 XP</div>
</div>
<div class="tabs">
  <div class="tab active" data-tab="farm">🌱 Ферма</div>
  <div class="tab" data-tab="shop">🛒 Магазин</div>
  <div class="tab" data-tab="inventory">📦 Склад</div>
  <div class="tab" data-tab="room">🏠 Комната</div>
  <div class="tab" data-tab="process">⚗️ Цех</div>
  <div class="tab" data-tab="friends">👥 Друзья</div>
</div>
<div class="content">
  <div class="section active" id="section-farm">
    <div class="customer-banner" id="customer-banner">
      <div class="customer-header"><div class="customer-avatar" id="cust-avatar">🧑</div><div><div class="customer-name" id="cust-name">Клиент</div><div class="customer-want" id="cust-want">Хочет купить...</div></div></div>
      <div class="customer-actions">
        <button class="btn btn-secondary btn-small" onclick="rejectCustomer()">Отказать</button>
        <button class="btn btn-purple btn-small" onclick="smokeWithCustomer()">🚬 Покурить</button>
        <button class="btn btn-small" onclick="dealWithCustomer()">💰 Продать</button>
      </div>
    </div>
    <div class="farm-grid" id="farm-grid"></div>
    <div style="margin-top:10px;text-align:center">
      <button class="btn btn-secondary btn-full" id="btn-buy-pot" onclick="buyPot()">➕ Купить горшок</button>
    </div>
  </div>
  <div class="section" id="section-shop"><div class="card-list" id="shop-list"></div></div>
  <div class="section" id="section-inventory"><div class="card-list" id="inventory-list"></div><div style="margin-top:10px"><button class="btn btn-full" onclick="sellAll()" id="btn-sell-all">💰 Продать всё</button></div></div>
  <div class="section" id="section-room"><div class="room-info" id="room-info"></div><div id="daily-box"></div><div class="card-list" id="room-list"></div></div>
  <div class="section" id="section-process"><div class="section-title">Переработка сырья</div><div class="card-list" id="process-list"></div><div class="section-title" style="margin-top:12px">Готовая продукция</div><div class="card-list" id="products-list"></div></div>
  <div class="section" id="section-friends">
    <div class="ref-card">
      <div style="font-weight:700;margin-bottom:6px">👥 Пригласи друзей</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.75);margin-bottom:8px">За каждого: <b>+150$</b> и <b>+20⚡</b></div>
      <div style="display:flex;justify-content:center;gap:12px;margin-bottom:8px;font-size:12px">
        <div>Приглашено: <b id="ref-count">0</b></div>
        <div>Заработано: <b id="ref-earned">0</b>$</div>
      </div>
      <button class="btn btn-full" onclick="shareReferral()">📤 Поделиться</button>
      <button class="btn btn-secondary btn-full" style="margin-top:4px" onclick="copyReferral()">📋 Скопировать</button>
      <div id="friends-list"></div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modal-seed"><div class="modal"><div class="modal-title">Выбери семя</div><div class="card-list" id="seed-list"></div><button class="btn btn-secondary btn-full" style="margin-top:10px" onclick="closeModal('modal-seed')">Отмена</button></div></div>
<div class="modal-overlay" id="modal-fert"><div class="modal"><div class="modal-title">Удобрения / Лечение</div><div class="card-list" id="fert-list"></div><button class="btn btn-secondary btn-full" style="margin-top:10px" onclick="closeModal('modal-fert')">Отмена</button></div></div>
<div class="toast" id="toast"></div>

if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('secondary_bg_color')}catch(e){}if(tg.initDataUnsafe?.user?.id)userId=String(tg.initDataUnsafe.user.id)}
const SERVER_URL=window.location.origin;
